buildscript {
    repositories {
        maven { url 'https://plugins.gradle.org/m2/' }
    }
}

repositories {
    maven { url 'https://maven.google.com' }
}

apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = 37
    defaultConfig {
        applicationId "ru.goodibunakov.amlabvideo"
        namespace 'ru.goodibunakov.amlabvideo'
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 35
        versionName "1.3.22"
        base.archivesName = "amlab-$versionName($versionCode)"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"
                ]
            }
        }
        packagingOptions {
            exclude 'META-INF/atomicfu.kotlin_module'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "ONE_SIGNAL_APP_ID", "\"$ONE_SIGNAL_APP_ID\""
        }
        release {
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "ONE_SIGNAL_APP_ID", "\"$ONE_SIGNAL_APP_ID\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

repositories {
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(":blitz")

    //Android
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.android.material:material:1.14.0'

    // Kotlin
    implementation 'androidx.core:core-ktx:1.19.0'

    // Rx
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //MaterialDrawer
    implementation 'com.mikepenz:materialdrawer:8.4.5'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    //Glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    ksp 'com.github.bumptech.glide:compiler:5.0.9'

    implementation 'com.github.kirich1409:viewbindingpropertydelegate-noreflection:1.5.9'

    //Youtube
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:11.1.0'

    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Stetho
    implementation 'com.facebook.stetho:stetho:1.6.0'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'

    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.room:room-rxjava2:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // Play core library
    implementation 'com.google.android.play:review-ktx:2.0.2'

    //OneSignal
    //noinspection NewerVersionAvailable,GradleDependency
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'